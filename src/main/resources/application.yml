spring:
  datasource:
    url: jdbc:h2:mem:shop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true

logging.level.org.hibernate.SQL: warn